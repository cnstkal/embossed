<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EMBOSSED</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f7f6f2;color:#171717;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overscroll-behavior-x:none}
main{width:min(760px,100%);margin:0 auto;padding:70px 14px 28px}
h1{font-size:25px;line-height:1.1;margin:0 0 14px;font-weight:800;letter-spacing:-.04em}
.card{background:#fff;border:1px solid #e6e3dc;border-radius:22px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.035);margin-bottom:12px}
.stage{width:100%;aspect-ratio:1/1;background-color:#f1f1ee;background-image:linear-gradient(45deg,#e7e7e3 25%,transparent 25%),linear-gradient(-45deg,#e7e7e3 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e7e7e3 75%),linear-gradient(-45deg,transparent 75%,#e7e7e3 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;border-radius:17px;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}
.stage canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto}
.empty{color:#777;text-align:center;font-size:14px;padding:20px}
.upload{display:flex;align-items:center;justify-content:center;min-height:66px;border:1px dashed #cfcac0;border-radius:16px;cursor:pointer;font-size:16px;font-weight:650;margin-bottom:12px}
.upload input{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:#777;line-height:1.4}
label.full{grid-column:1/-1}
select,input[type=range],input[type=color]{width:100%;margin-top:6px}
select{height:48px;border:1px solid #ddd8d0;border-radius:13px;background:#fff;padding:0 12px;font-size:16px;color:#181818}
input[type=color]{height:48px;border:1px solid #ddd8d0;border-radius:13px;padding:4px;background:#fff}
input[type=range]{accent-color:#111}
.val{float:right;color:#111;font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{height:50px;border:1px solid #ddd8d0;border-radius:14px;background:#fff;font-size:16px;font-weight:700}
button.primary{background:#111;color:#fff;border-color:#111}
button:active{transform:scale(.99)}
.note{font-size:12px;color:#888;line-height:1.5;margin-top:9px}
@media(max-width:560px){
 main{padding:68px 10px 24px}
 h1{font-size:23px}
 .grid{grid-template-columns:1fr 1fr}
}
#reset{background:#fff!important;color:#2196f3!important;border-color:#111!important}
</style>
</head><body>
<main>
<h1>EMBOSSED</h1>
<section class="card">
  <div class="stage" id="stage">
    <div class="empty" id="empty"></div>
    <canvas id="canvas" hidden></canvas>
  </div>
</section>
<section class="card">
  <label class="upload">📷 사진 업로드<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/avif"></label>
  <div class="grid">
    <label>효과
      <select id="preset">
        <option value="emboss">EMBOSSED</option><option value="metal">METAL</option><option value="soft">SOFT EMBOSS</option><option value="deboss">DEBOSSED</option>
      </select>
    </label>
    <label>빛 방향
      <select id="light">
        <option value="nw">↖ TOP LEFT</option><option value="n">↑ TOP</option><option value="ne">↗ TOP RIGHT</option><option value="w">← LEFT</option><option value="e">→ RIGHT</option><option value="sw">↙ BOTTOM LEFT</option><option value="s">↓ BOTTOM</option><option value="se">↘ BOTTOM RIGHT</option>
      </select>
    </label>
    <label>엠보싱 강도 <span class="val" id="strengthVal">75%</span><input id="strength" type="range" min="0" max="100" value="100"></label>
    <label>명암 <span class="val" id="contrastVal">35%</span><input id="contrast" type="range" min="0" max="100" value="55"></label>
    <label>금속 질감 <span class="val" id="metalVal">70%</span><input id="metal" type="range" min="0" max="100" value="90"></label>
    <label>흑백 정도 <span class="val" id="grayVal">100%</span><input id="gray" type="range" min="0" max="100" value="100"></label>
  </div>
  <div class="actions"><button id="reset">초기화</button><button class="primary" id="save">PNG 저장</button></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const canvas=$('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
let source=null,W=0,H=0,raf=0;
let preview={w:0,h:0,lum:null,gx:null,gy:null,bevel:null};
const PREVIEW_MAX=600,stateKey='embossed-state-v1',clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let originalFileName='EMBOSSED';
function loadImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(url);resolve(im)};im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('decode'))};im.src=url})}
function grayAt(data,i){return data[i]*.299+data[i+1]*.587+data[i+2]*.114}
function lightVector(){return ({nw:[-.707,-.707],n:[0,-1],ne:[.707,-.707],w:[-1,0],e:[1,0],sw:[-.707,.707],s:[0,1],se:[.707,.707]})[$('light').value]||[-.707,-.707]}
function buildPreview(){if(!source)return;const scale=Math.min(1,PREVIEW_MAX/Math.max(W,H)),rw=Math.max(1,Math.round(W*scale)),rh=Math.max(1,Math.round(H*scale)),c=document.createElement('canvas');c.width=rw;c.height=rh;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(source,0,0,rw,rh);const data=x.getImageData(0,0,rw,rh).data,lum=new Float32Array(rw*rh);for(let i=0,p=0;i<lum.length;i++,p+=4)lum[i]=data[p]*.299+data[p+1]*.587+data[p+2]*.114;const gx=new Float32Array(rw*rh),gy=new Float32Array(rw*rh),bevel=new Float32Array(rw*rh),at=(xx,yy)=>lum[Math.max(0,Math.min(rh-1,yy))*rw+Math.max(0,Math.min(rw-1,xx))];for(let y=0;y<rh;y++)for(let xx=0;xx<rw;xx++){const i=y*rw+xx,dx=(-at(xx-1,y-1)-2*at(xx-1,y)-at(xx-1,y+1)+at(xx+1,y-1)+2*at(xx+1,y)+at(xx+1,y+1))/4,dy=(-at(xx-1,y-1)-2*at(xx,y-1)-at(xx+1,y-1)+at(xx-1,y+1)+2*at(xx,y+1)+at(xx+1,y+1))/4;gx[i]=dx;gy[i]=dy;bevel[i]=Math.sqrt(dx*dx+dy*dy)}preview={w:rw,h:rh,lum,gx,gy,bevel}}
function render(fullRes=false){if(!source)return;cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>fullRes?renderFull():renderPreview())}
function renderPreview(){const rw=preview.w,rh=preview.h;canvas.width=rw;canvas.height=rh;const out=ctx.createImageData(rw,rh),b=out.data,lum=preview.lum,gx=preview.gx,gy=preview.gy,bevel=preview.bevel,preset=$('preset').value,strength=+$('strength').value/100,contrast=+$('contrast').value/100,metal=+$('metal').value/100,grayMix=+$('gray').value/100,[lx,ly]=lightVector(),sign=preset==='deboss'?-1:1,softness=preset==='soft'?0.62:1,metalPower=preset==='metal'?1.22:1;for(let i=0,p=0;i<lum.length;i++,p+=4){const gxv=gx[i],gyv=gy[i],bv=bevel[i],g=lum[i],nx=-gxv*strength*.075*metalPower,ny=-gyv*strength*.075*metalPower,len=Math.sqrt(nx*nx+ny*ny+1)||1,dot=nx/len*lx+ny/len*ly+.72/len;let light=.34+.66*Math.max(0,dot);light=Math.max(0,Math.min(1,light+Math.min(1,bv/28)*.30-Math.min(1,bv/42)*.22));const directional=(-gxv*lx-gyv*ly)*.42*strength*softness;let height=128+(g-128)*(.55+contrast*1.15)+directional*2.6*sign;height=Math.max(0,Math.min(255,height));const silver=118+height*.38,relief=silver*.42+light*118,sheen=(Math.sin((i%rw*.031)+Math.floor(i/rw)*.009)*.5+.5)*metal*8;let v=relief+sheen;if(preset==='metal'){v=128+(v-128)*1.18;v+=bv*.55}else if(preset==='soft')v=128+(v-128)*.88;else v=128+(v-128)*(1+metal*.22);v=Math.max(0,Math.min(255,v));const f=Math.max(0,Math.min(255,g*(1-grayMix)+v*grayMix));b[p]=b[p+1]=b[p+2]=f;b[p+3]=255}ctx.putImageData(out,0,0);canvas.hidden=false;$('empty').style.display='none'}
function renderFull(){const rw=W,rh=H;canvas.width=rw;canvas.height=rh;ctx.drawImage(source,0,0,rw,rh);const src=ctx.getImageData(0,0,rw,rh),out=ctx.createImageData(rw,rh),a=src.data,b=out.data,preset=$('preset').value,strength=+$('strength').value/100,contrast=+$('contrast').value/100,metal=+$('metal').value/100,grayMix=+$('gray').value/100,[lx,ly]=lightVector(),lum=new Float32Array(rw*rh);for(let i=0,p=0;i<lum.length;i++,p+=4)lum[i]=grayAt(a,p);const sample=(x,y)=>lum[Math.max(0,Math.min(rh-1,y))*rw+Math.max(0,Math.min(rw-1,x))],sign=preset==='deboss'?-1:1,softness=preset==='soft'?.62:1,metalPower=preset==='metal'?1.22:1;for(let y=0;y<rh;y++)for(let x=0;x<rw;x++){const i=(y*rw+x)*4,g=lum[y*rw+x],gx=(-sample(x-1,y-1)-2*sample(x-1,y)-sample(x-1,y+1)+sample(x+1,y-1)+2*sample(x+1,y)+sample(x+1,y+1))/4,gy=(-sample(x-1,y-1)-2*sample(x,y-1)-sample(x+1,y-1)+sample(x-1,y+1)+2*sample(x,y+1)+sample(x+1,y+1))/4,bv=Math.sqrt(gx*gx+gy*gy),nx=-gx*strength*.075*metalPower,ny=-gy*strength*.075*metalPower,len=Math.sqrt(nx*nx+ny*ny+1)||1,dot=nx/len*lx+ny/len*ly+.72/len;let light=.34+.66*Math.max(0,dot);light=Math.max(0,Math.min(1,light+Math.min(1,bv/28)*.30-Math.min(1,bv/42)*.22));const directional=(-gx*lx-gy*ly)*.42*strength*softness;let height=128+(g-128)*(.55+contrast*1.15)+directional*2.6*sign;height=Math.max(0,Math.min(255,height));const silver=118+height*.38,relief=silver*.42+light*118,sheen=(Math.sin(x*.031+y*.009)*.5+.5)*metal*8;let v=relief+sheen;if(preset==='metal'){v=128+(v-128)*1.18;v+=bv*.55}else if(preset==='soft')v=128+(v-128)*.88;else v=128+(v-128)*(1+metal*.22);v=Math.max(0,Math.min(255,v));const f=Math.max(0,Math.min(255,g*(1-grayMix)+v*grayMix));b[i]=b[i+1]=b[i+2]=f;b[i+3]=255}ctx.putImageData(out,0,0);canvas.hidden=false;$('empty').style.display='none'}
function fitPreview(){if(!source)return;const stage=$('stage'),scale=Math.min(1,(stage.clientWidth-4)/W,(stage.clientHeight-4)/H);canvas.style.width=Math.max(1,Math.round(W*scale))+'px';canvas.style.height=Math.max(1,Math.round(H*scale))+'px'}
function saveState(){try{localStorage.setItem(stateKey,JSON.stringify({preset:$('preset').value,light:$('light').value,strength:$('strength').value,contrast:$('contrast').value,metal:$('metal').value,gray:$('gray').value}))}catch(e){}}
function loadState(){try{const s=JSON.parse(localStorage.getItem(stateKey)||'null');if(!s)return;['preset','light','strength','contrast','metal','gray'].forEach(id=>{if(s[id]!=null)$(id).value=s[id]})}catch(e){}}
function syncLabels(){$('strengthVal').textContent=$('strength').value+'%';$('contrastVal').textContent=$('contrast').value+'%';$('metalVal').textContent=$('metal').value+'%';$('grayVal').textContent=$('gray').value+'%'}
$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;if(!/^image\/(png|jpeg|webp|avif)$/.test(f.type)){alert('JPG / PNG / WebP / AVIF 이미지만 올려줘.');return}if(f.size>60*1024*1024){alert('파일이 너무 커요. 60MB 이하의 이미지를 사용해주세요.');return}try{source=await loadImage(f);originalFileName=f.name.replace(/\.[^.]+$/,'')||'EMBOSSED';W=source.naturalWidth;H=source.naturalHeight;buildPreview();render(false);fitPreview()}catch(err){console.error(err);alert('이미지를 불러오지 못했어. JPG/PNG/WebP 파일을 다시 올려줘.')}};['preset','light','strength','contrast','metal','gray'].forEach(id=>{$(id).addEventListener('input',()=>{syncLabels();saveState();render()});$(id).addEventListener('change',()=>{syncLabels();saveState();render()})});window.addEventListener('resize',fitPreview);
$('reset').onclick=()=>{source=null;W=0;H=0;originalFileName='EMBOSSED';preview={w:0,h:0,lum:null,gx:null,gy:null,bevel:null};cancelAnimationFrame(raf);ctx.clearRect(0,0,canvas.width,canvas.height);canvas.hidden=true;$('empty').style.display='';$('file').value='';$('preset').value='emboss';$('light').value='nw';$('strength').value=100;$('contrast').value=55;$('metal').value=90;$('gray').value=100;syncLabels();saveState();render(false)};
$('save').onclick=async()=>{if(!source)return;render(true);await new Promise(requestAnimationFrame);await new Promise(requestAnimationFrame);canvas.toBlob(async blob=>{if(!blob){alert('PNG 저장에 실패했어요. 다시 시도해주세요.');return}const file=new File([blob],originalFileName+'.png',{type:'image/png',lastModified:Date.now()});if(matchMedia('(pointer:coarse)').matches&&navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){try{await navigator.share({files:[file],title:'EMBOSSED',text:''});return}catch(err){if(err?.name==='AbortError')return}}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=originalFileName+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')};
loadState();syncLabels();
</script>
</body>
</html>
